body.mpwb-body{

  --mpwb-subtle:#f6f8fa;--mpwb-hover:#eef2f6;--mpwb-ink:#1f2328;--mpwb-muted:#57606a;

  --mpwb-up:#b42332;--mpwb-down:#18733b;--mpwb-danger-bg:#ffebe9;
  --mpwb-success:#18733b;--mpwb-success-bg:#dafbe1;--mpwb-warning:#865800;--mpwb-warning-bg:#fff8c5;
  --mpwb-code-key:#8250df;--mpwb-code-str:#0a3069;--mpwb-code-num:#0550ae;
  --mpwb-chart-purple:#8250df;--mpwb-chart-pink:#bf3989;--mpwb-chart-orange:#953800;
  --mpwb-chart-amber:#865800;--mpwb-chart-slate:#57606a;--mpwb-shadow:rgba(31,35,40,.08);--mpwb-backdrop:rgba(13,17,23,.6);

  background:var(--mpwb-bg)!important;color:var(--mpwb-ink)!important;
}
html[data-mpwb-theme='dark'] body.mpwb-body{
  color-scheme:dark;--mpwb-bg:#0d1117;--mpwb-surface:#161b22;--mpwb-raised:#1c232d;
  --mpwb-subtle:#0d1117;--mpwb-hover:#212a36;--mpwb-ink:#e6edf3;--mpwb-muted:#9da7b3;
  --mpwb-line:#3d4856;--mpwb-line-soft:#28313d;--mpwb-accent:#79c0ff;
  --mpwb-accent-soft:#142b43;--mpwb-accent-line:#3c6f9c;--mpwb-button:#79c0ff;--mpwb-button-ink:#0d1117;
  --mpwb-up:#ff919b;--mpwb-down:#75d69a;--mpwb-danger-bg:#3c2026;
  --mpwb-success:#75d69a;--mpwb-success-bg:#142e21;--mpwb-warning:#e7bf6b;--mpwb-warning-bg:#342c19;
  --mpwb-code-key:#d2a8ff;--mpwb-code-str:#a5d6ff;--mpwb-code-num:#79c0ff;
  --mpwb-chart-purple:#d2a8ff;--mpwb-chart-pink:#ff9bce;--mpwb-chart-orange:#ffa657;
  --mpwb-chart-amber:#e7bf6b;--mpwb-chart-slate:#b1bac4;--mpwb-shadow:rgba(0,0,0,.25);--mpwb-focus:#79c0ff;
}
.mpwb-theme-switch{display:flex;gap:3px;flex-shrink:0;padding:3px;border:1px solid var(--mpwb-line);
  border-radius:7px;background:var(--mpwb-subtle);font:12px/1.5 var(--mpwb-font);}
.mpwb-theme-switch button{min-height:32px;padding:5px 10px;border:1px solid transparent;border-radius:4px;
  background:transparent;color:var(--mpwb-muted);font:inherit;cursor:pointer;}
.mpwb-theme-switch button[aria-pressed='true']{background:var(--mpwb-surface);border-color:var(--mpwb-line);color:var(--mpwb-ink);}
.mpwb-theme-switch button:focus-visible{outline:3px solid var(--mpwb-focus);outline-offset:2px;}
.mpwb-sidebar,.mpwb-main,.mpwb-topbar,.mpwb-subnav,.mpwb-content,.mpwb-context-actions,
.mpwb-sidebar *,.mpwb-topbar *,.mpwb-subnav *,.mpwb-context-actions *{box-sizing:border-box;}
.mpwb-sidebar{position:fixed;inset:0 auto 0 0;width:var(--mpwb-sidebar-width);z-index:20;
  display:flex;flex-direction:column;padding:30px 18px 22px;background:var(--mpwb-surface);

.mpwb-brand{display:flex;align-items:center;gap:10px;margin:0 5px 34px;

.mpwb-brand-mark{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;

.mpwb-brand-copy{letter-spacing:-.4px;}
.mpwb-brand-copy small{display:block;font-size:10px;font-weight:400;letter-spacing:.4px;
  color:var(--mpwb-muted);line-height:1.8;margin-top:3px;}
.mpwb-caption{padding:0 13px;margin-bottom:12px;font-size:11px;letter-spacing:1px;color:var(--mpwb-muted);}
.mpwb-nav{display:flex;flex-direction:column;gap:7px;}
.mpwb-nav-item{display:flex;align-items:center;gap:12px;min-height:46px;padding:12px 14px;
  border:0;border-radius:10px;font-size:13px;font-weight:500;line-height:1.5;
  color:var(--mpwb-muted)!important;text-decoration:none!important;white-space:nowrap;}
a.mpwb-nav-item:hover{background:var(--mpwb-hover);color:var(--mpwb-accent)!important;}
.mpwb-nav-item.mpwb-active{background:var(--mpwb-accent-soft);color:var(--mpwb-accent)!important;font-weight:650;}
.mpwb-nav-item.mpwb-disabled{color:var(--mpwb-muted)!important;cursor:default;}
.mpwb-nav-icon,.mpwb-action-icon{display:inline-grid;place-items:center;flex-shrink:0;width:20px;height:20px;line-height:1;}
.mpwb-nav-icon svg,.mpwb-action-icon svg{display:block;width:20px;height:20px;max-width:none;min-width:0;margin:0;background:none;border:0;}
.mpwb-nav-icon svg *,.mpwb-action-icon svg *{fill:none;stroke:currentColor;}
.mpwb-nav-item.mpwb-active:after{content:'';margin-left:auto;width:5px;height:5px;border-radius:50%;background:var(--mpwb-accent);}
.mpwb-aux{margin-top:auto;padding:20px 12px 16px;font-size:12px;color:var(--mpwb-muted);}
.mpwb-aux summary,.mpwb-mobile-aux summary{cursor:pointer;}
.mpwb-aux a{display:block;color:var(--mpwb-accent);text-decoration:none;padding:10px 0 0;}
.mpwb-sidebar-foot{padding:0 12px;color:var(--mpwb-muted);font-size:10px;line-height:1.9;}
.mpwb-main{margin-left:var(--mpwb-sidebar-width);min-width:0;min-height:100vh;}
.mpwb-topbar{max-width:var(--mpwb-content-max);margin:0 auto;padding:18px var(--mpwb-page-pad) 0;
  display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;background:transparent;border:0;
  font:12px/1.6 var(--mpwb-font);color:var(--mpwb-muted);}
.mpwb-breadcrumb{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap;}
.mpwb-breadcrumb a{color:var(--mpwb-muted);text-decoration:none;}
.mpwb-breadcrumb a:hover{color:var(--mpwb-accent);}
.mpwb-breadcrumb .mpwb-action-icon,.mpwb-breadcrumb .mpwb-action-icon svg{width:16px;height:16px;}
.mpwb-subnav{display:flex;gap:6px;flex-wrap:wrap;max-width:var(--mpwb-content-max);margin:0 auto;
  padding:22px var(--mpwb-page-pad) 0;font:12px/1.5 var(--mpwb-font);}
.mpwb-subnav a{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:7px 14px;
  border:1px solid transparent;border-radius:8px;background:transparent;color:var(--mpwb-muted);text-decoration:none;}
.mpwb-subnav a[aria-current='page']{color:var(--mpwb-accent);background:var(--mpwb-surface);border-color:var(--mpwb-accent-line);font-weight:600;}
.mpwb-subnav a:hover{color:var(--mpwb-accent);background:var(--mpwb-accent-soft);}
.mpwb-context-actions{display:flex;gap:16px;flex-wrap:wrap;max-width:var(--mpwb-content-max);margin:0 auto;
  padding:10px var(--mpwb-page-pad) 0;font:12px/1.6 var(--mpwb-font);}
.mpwb-context-actions a{display:inline-flex;align-items:center;gap:3px;min-height:24px;

.mpwb-context-actions a:hover{text-decoration:underline;text-underline-offset:3px;}
.mpwb-context-actions .mpwb-action-icon,.mpwb-context-actions .mpwb-action-icon svg{width:14px;height:14px;}
.mpwb-content{max-width:var(--mpwb-content-max);margin:0 auto;padding:22px var(--mpwb-page-pad) 36px;min-width:0;}
.mpwb-content{--card2:var(--mpwb-subtle);--line:var(--mpwb-line);
  --sw-def:var(--mpwb-accent);--sw-bt:var(--mpwb-chart-orange);}
.mpwb-content>.wrap{width:100%;max-width:none;margin:0;padding:0;min-width:0;}

.mpwb-main:not(.mpwb-report) .mpwb-content :is(div,span,p,small,footer):is(.dim2,.pcode,.scode,.wcode,.cd,footer.site){color:var(--mpwb-muted);}

(() => {
  'use strict';
  const root = document.documentElement, key = 'mpwb-theme-v1';
  const valid = value => value === 'light' || value === 'dark';
  let initial = 'light';
  try {
    const stored = localStorage.getItem(key) || localStorage.getItem('mp-md-theme-v1');
    if (valid(stored)) initial = stored;
  } catch (_) {}
  function apply(value, persist) {
    const theme = valid(value) ? value : 'light';
    root.dataset.mpwbTheme = theme;
    root.querySelectorAll('[data-mpwb-theme-choice]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.mpwbThemeChoice === theme));
    });
    if (persist) { try { localStorage.setItem(key, theme); } catch (_) {} }
  }
  apply(initial, false);
  function bind() {
    apply(root.dataset.mpwbTheme, false);
    root.querySelectorAll('[data-mpwb-theme-choice]').forEach(button => {
      button.addEventListener('click', () => apply(button.dataset.mpwbThemeChoice, true));
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind, {once:true});
  else bind();
  window.addEventListener('storage', event => {
    if (event.key === key) apply(event.newValue, false);
  });
})();
